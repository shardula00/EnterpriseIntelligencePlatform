[project]
name = "eip-backend"
version = "0.1.0"
description = "Enterprise Intelligence Platform - backend API"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py312"
# Alembic generates versions/*.py from its own template, not ours - don't
# hold auto-generated migration files to hand-authored style rules.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's `Depends(...)` in a default argument is the framework's
# idiomatic dependency-injection pattern, not the footgun this rule targets.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Phase 12 - coverage is measured and reported (locally and in CI), not
# gated at a hard percentage: see SECURITY.md / backend/README.md for why -
# a numeric floor invites padding tests to hit a number rather than testing
# what actually matters, and this project's coverage instead drives "did we
# find a meaningful untested branch," not a CI failure condition.
[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
]

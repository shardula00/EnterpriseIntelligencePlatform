# Phase 12: serves the Vite production build (frontend/dist) inside the
# frontend container. React Router does client-side routing, so any path
# that isn't a real static asset must fall back to index.html - otherwise a
# hard refresh on e.g. /decisions would 404 at the web server instead of
# reaching the SPA's router.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Cheap, dependency-free healthcheck target - the Dockerfile's
    # HEALTHCHECK hits this instead of index.html so a check never depends
    # on JS bundle content, only on nginx itself being up.
    location /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Phase 13: production compose file for the single EC2 instance. Mirrors
# infra/docker-compose.yml's topology as closely as practical (same three
# services, same images, same env-driven Settings, same bind-mount pattern
# for persistent data) - see infra/aws/README.md for what's different and
# why:
#   - images are pulled from ECR (`image:`), not built locally (`build:`)
#   - postgres/backend/frontend publish NO host ports - only `caddy` is
#     reachable from the internet, terminating HTTPS and reverse-proxying
#     to the other three over the internal Compose network
#   - volumes point at /opt/eip/data (this instance's persistent EBS-backed
#     path) instead of the repo's local data/ directory
#   - secrets come from .env.prod (generated by fetch-secrets.sh from SSM
#     Parameter Store at deploy time - never committed, never hand-edited
#     on the instance) instead of infra/.env
#
# This file is not runnable until infra/aws/README.md's manual setup steps
# (EC2 instance, IAM role, ECR repo, SSM parameters, DNS) are complete - see
# that file for the exact prerequisites and what remains a placeholder
# until you provide a real domain/budget.
#
# IMPORTANT: always invoke with `--env-file .env.prod` (see README.md/
# deploy.yml/backup.sh) - a plain `docker compose -f docker-compose.prod.yml
# ...` will NOT pick up .env.prod. Compose's own ${VAR} interpolation
# (used below for DATABASE_URL, image tags, etc.) only ever reads from the
# shell environment or the file passed via --env-file; a service-level
# `env_file:` directive is a different mechanism (injects vars into the
# *container*, too late for Compose to use them while parsing this file),
# which is why this file doesn't use one.

name: eip-prod

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eip_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-eip_prod}
    # Bound to the instance's own loopback only (127.0.0.1), never to
    # 0.0.0.0 - not internet-reachable regardless of security group state
    # (defense in depth), but still reachable from the instance itself,
    # which is exactly what the SSM port-forwarding troubleshooting
    # workflow in README.md needs. The backend container reaches Postgres
    # over the internal Compose network either way, not through this port.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - /opt/eip/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eip_user} -d ${POSTGRES_DB:-eip_prod}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${ECR_REGISTRY}/eip-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-eip_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-eip_prod}
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Set from the real domain once you have one - see README.md/
      # ROLLBACK.md and the Caddyfile placeholder markers. Left as a
      # localhost-only default until then, matching "stop before
      # configuring HTTPS if there is no domain yet."
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-["https://REPLACE_WITH_YOUR_DOMAIN"]}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      UPLOAD_STORAGE_DIR: /app/data/raw/uploads
      ML_ARTIFACTS_DIR: /app/data/ml_artifacts
      RAG_DOCUMENT_STORAGE_DIR: /app/data/raw/documents
    volumes:
      - /opt/eip/data/app:/app/data

  frontend:
    image: ${ECR_REGISTRY}/eip-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    # No published port - reached only via caddy.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/eip/data/caddy:/data
      - /opt/eip/caddy_config:/config
